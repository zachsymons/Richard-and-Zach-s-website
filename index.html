if(!q.d)bt='<button class="btn hv" onclick="hp()">💡 I need help — show working</button>';else{if(!q.sw)bt+='<button class="btn hv" onclick="sw()">📝 See the working</button>';bt+='<button class="btn pri hv" onclick="nx()">'+(Q.k<7?'Next →':'Finish ✓')+'</button>'}
return'<div class="'+(Q.f?'up':'')+'" style="--c:'+c+'"><div class="top"><button class="btn hv" onclick="go(\'home\')">← Topics</button><b>'+t[0]+'</b><span class="pill">Score '+Q.sc+'</span></div><div class="bar"><i style="width:'+(Q.k+(q.d?1:0))/8*100+'%"></i></div><p class="mu">Question '+(Q.k+1)+' of 8'+(q.hp?' · helped (not scored)':'')+'</p><div class="qbox">'+E(q.q)+'</div><div class="opts">'+q.o.map((o,j)=>'<button class="opt hv '+(q.d?o==q.A?'good':j==q.p?'bad':'dim':'')+'" onclick="pk('+j+')"><i>'+'ABCD'[j]+'</i>'+E(o)+'</button>').join('')+'</div>'+fb+st+'<div class="row">'+bt+'</div></div>'}
function res(){let t=T[Q.i],c=SC[t[1]],s=Q.sc;return'<div class="up" style="--c:'+c+';text-align:center"><h2 style="text-align:left">'+t[0]+' — results</h2><div class="ring" style="--p:'+s/8*100+'"><b>'+s+'/8</b></div><h3>'+(s==8?'Perfect score! 🌟':s>=6?'Great work — topic mastered! 🎉':s>=4?'Getting there — review the working and go again 💪':'Keep going — check the flashcards, then retry 📚')+'</h3><p class="mu">Questions you needed help with: '+Q.qs.filter(q=>q.hp).length+'. Your best: '+S.p[Q.i].b+'/8.</p><div class="row" style="justify-content:center"><button class="btn pri hv" onclick="start('+Q.i+')">🔄 New questions</button><button class="btn hv" onclick="go(\'home\')">All topics</button><button class="btn hv" onclick="start('+(Q.i+1)%T.length+')">Next topic →</button></div></div>'}
function fcStart(s=-1){FC={s,k:0,deck:T.map((_,i)=>i).filter(i=>s<0||T[i][1]==s)};go('fc')}
function fn(d){FC.k=(FC.k+d+FC.deck.length)%FC.deck.length;FC.an=1;go('fc')}
function ff(){$('.fcard').classList.toggle('flip')}
function fm(v){let i=FC.deck[FC.k];if(v)S.fk[i]=1;else delete S.fk[i];save();fn(1)}
function shf(){sh(FC.deck);FC.k=0;FC.an=1;go('fc')}
function nt(v){S.nt[FC.deck[FC.k]]=v;save()}
function fcv(){let i=FC.deck[FC.k],t=T[i],c=SC[t[1]],a=FC.an;FC.an=0;
return'<div style="--c:'+c+'"><div class="top up"><h2 style="--c:'+c+'">Flashcards</h2><select onchange="fcStart(+this.value)"><option value="-1">All topics</option>'+SN.map((s,n)=>'<option value="'+n+'"'+(FC.s==n?' selected':'')+'>'+s+'</option>').join('')+'</select></div><p class="mu">Card '+(FC.k+1)+' of '+FC.deck.length+' · '+FC.deck.filter(x=>S.fk[x]).length+' marked as known'+(S.fk[i]?' · ✅ this one':'')+'</p><div class="scene '+(a?'slide':'up')+'" onclick="ff()"><div class="fcard"><div class="face"><span class="chip">'+SN[t[1]]+' · tap to flip</span><h3>'+E(t[3])+'</h3></div><div class="face back"><span class="chip">Notes</span><p style="white-space:pre-line">'+E(t[4])+'</p></div></div></div><div class="row"><button class="btn hv" onclick="fn(-1)">← Prev</button><button class="btn hv" onclick="fm(0)">🔁 Practise again</button><button class="btn hv" onclick="fm(1)">✅ Got it</button><button class="btn hv" onclick="fn(1)">Next →</button><button class="btn hv" onclick="shf()">🔀 Shuffle</button><button class="btn pri hv" onclick="start('+i+')">Quiz this topic ▶</button></div><p style="margin-bottom:0"><b>My notes</b> <small>(saved automatically)</small></p><textarea oninput="nt(this.value)" placeholder="Type your own tips or worked examples here…">'+E(S.nt[i]||'')+'</textarea></div>'}
function go(v){V=v;draw();scrollTo({top:0})}
function draw(){$('#app').innerHTML=V=='home'?home():V=='q'?quiz():V=='res'?res():fcv();$('#t0').classList.toggle('on',V!='fc');$('#t1').classList.toggle('on',V=='fc');if(Q)Q.f=0}
function th(){let d=document.documentElement,dk=d.dataset.theme=='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dk?'light':'dark'}
/* tools */
let cur='calc';
function tool(n,f){let d=$('#dr');if(d.classList.contains('on')&&cur==n&&!f){d.classList.remove('on');return}cur=n;d.classList.add('on');$('#calc').style.display=n=='calc'?'':'none';$('#pad').style.display=n=='pad'?'':'none';$('#dt').textContent=n=='calc'?'🧮 Calculator':'✏️ Notepad'}
const dh=$('#dh');let dg=null;dh.onpointerdown=e=>{if(e.target.closest('button'))return;let r=$('#dr').getBoundingClientRect();dg=[e.clientX-r.left,e.clientY-r.top];dh.setPointerCapture(e.pointerId)};dh.onpointermove=e=>{if(dg){let d=$('#dr');d.style.left=e.clientX-dg[0]+'px';d.style.top=e.clientY-dg[1]+'px';d.style.right=d.style.bottom='auto'}};dh.onpointerup=()=>dg=null;
let ce='',ans=0,dn=0;const FN={sin:x=>Math.sin(x*Math.PI/180),cos:x=>Math.cos(x*Math.PI/180),tan:x=>Math.tan(x*Math.PI/180),asin:x=>Math.asin(x)*180/Math.PI,acos:x=>Math.acos(x)*180/Math.PI,atan:x=>Math.atan(x)*180/Math.PI,sqrt:Math.sqrt};
$('#ck').innerHTML=[['sin','cos','tan','(',')'],['sin⁻¹','cos⁻¹','tan⁻¹','√','π'],['7','8','9','⌫','C'],['4','5','6','×','÷'],['1','2','3','+','−'],['0','.','^','Ans','=']].flat().map(k=>'<button class="'+('×÷+−^'.includes(k)?'op':k=='='?'eq':'')+'" onclick="kp(\''+k+'\')">'+k+'</button>').join('');
function ev(){try{let e=ce.replace(/(\d|\)|π|Ans)(?=[(π√A]|sin|cos|tan)/g,'$1*').replace(/\)(?=\d)/g,')*').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/π/g,'('+Math.PI+')').replace(/Ans/g,'('+ans+')').replace(/√\(/g,'FN.sqrt(').replace(/(sin|cos|tan)⁻¹\(/g,'FN.a$1(').replace(/(?<![a-z.])(sin|cos|tan)\(/g,'FN.$1(');let r=Function('FN','return '+e)(FN);if(!isFinite(r))throw 0;r=+r.toPrecision(10);ans=r;$('#cr').textContent='= '+r}catch(x){$('#cr').textContent='Error'}dn=1}
function kp(k){if(k=='C'){ce='';$('#cr').textContent='';dn=0}else if(k=='⌫')ce=ce.replace(/(sin⁻¹\(|cos⁻¹\(|tan⁻¹\(|sin\(|cos\(|tan\(|√\(|Ans|.)$/,'');else if(k=='=')ev();else{let f=['sin','cos','tan','sin⁻¹','cos⁻¹','tan⁻¹','√'].includes(k)?k+'(':k;if(dn){ce='+−×÷^'.includes(k)?'Ans':'';dn=0}ce+=f}$('#ce').textContent=ce||'0'}
onkeydown=e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;let k=e.key;if(V=='fc'&&!$('#dr').classList.contains('on')){if(k=='ArrowRight')fn(1);else if(k=='ArrowLeft')fn(-1)}
if($('#dr').classList.contains('on')&&cur=='calc'){if(/^[0-9.()+]$/.test(k))kp(k);else if(k=='-')kp('−');else if(k=='*')kp('×');else if(k=='/')kp('÷');else if(k=='^')kp('^');else if(k=='Enter'||k=='=')kp('=');else if(k=='Backspace')kp('⌫');else return;e.preventDefault()}};
const cv=$('#cv'),cx=cv.getContext('2d'),ring=$('#ring');let sz={pen:3,er:24},tl='pen',col='#1d2340',dw=0,un=[];
$('#sws').innerHTML=['#1d2340','#e11d48','#2563eb','#16a34a'].map(c=>'<button class="sw hv" style="background:'+c+'" onclick="col=\''+c+'\';stl(\'pen\')"></button>').join('');
function pvz(){let s=Math.min(sz[tl],36);$('#pv').style.cssText='width:'+s+'px;height:'+s+'px'}
function stl(t){tl=t;$('#bp').classList.toggle('on',t=='pen');$('#be').classList.toggle('on',t=='er');$('#sl').value=sz[t];pvz()}
function ssz(v){sz[tl]=v;pvz()}pvz();
const pos=e=>{let r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height,cv.width/r.width,r]};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);un.push(cx.getImageData(0,0,cv.width,cv.height));if(un.length>25)un.shift();dw=1;let[x,y]=pos(e);cx.lineCap=cx.lineJoin='round';cx.lineWidth=sz[tl];cx.strokeStyle=col;cx.globalCompositeOperation=tl=='er'?'destination-out':'source-over';cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.01,y);cx.stroke()};
cv.onpointermove=e=>{let[x,y,k,r]=pos(e);ring.style.cssText='display:block;width:'+sz[tl]/k+'px;height:'+sz[tl]/k+'px;left:'+(e.clientX-r.left)+'px;top:'+(e.clientY-r.top)+'px';if(dw){cx.lineTo(x,y);cx.stroke();cx.beginPath();cx.moveTo(x,y)}};
cv.onpointerup=()=>dw=0;cv.onpointerleave=()=>ring.style.display='none';
function und(){if(un.length)cx.putImageData(un.pop(),0,0)}
function clr(){un.push(cx.getImageData(0,0,cv.width,cv.height));cx.clearRect(0,0,cv.width,cv.height)}
draw();
