<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Year 11 Maths Revision</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2340;--mu:#6b7194;--ac:#5b5bf0;--bd:#e3e6f2;--ok:#16a34a;--no:#e11d48;--sh:0 2px 10px rgba(30,40,90,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--card:#1a1e33;--tx:#e8ebff;--mu:#9aa0c7;--bd:#2c3152;--sh:0 2px 12px rgba(0,0,0,.45)}}
:root[data-theme=dark]{--bg:#0f1220;--card:#1a1e33;--tx:#e8ebff;--mu:#9aa0c7;--bd:#2c3152;--sh:0 2px 12px rgba(0,0,0,.45)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:800;font-size:18px;margin-right:auto}.tabs,.tools{display:flex;gap:8px}
.tab,.ic,.btn{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px}
.tab.on,.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.hv{transition:transform .18s,box-shadow .18s,background .18s}
.hv:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 2px var(--c,var(--ac)),var(--sh)}
.hv:active{transform:scale(.97)}
main{max-width:980px;margin:0 auto;padding:20px 16px 100px}
.up{animation:up .45s both}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hero{display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#5b5bf0,#8b5cf6);color:#fff;border-radius:20px;padding:24px}
.hero h1{margin:0 0 4px}.hero p{margin:0;opacity:.9;max-width:460px}.stat{min-width:230px}.stat b{font-size:30px}.stat span{margin-left:6px}
.hero .bar{background:#fff4;margin:6px 0}.hero .bar i{background:#fff}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--ac));border-radius:9px;transition:width .6s}
h2{border-left:5px solid var(--c,var(--ac));padding-left:10px;margin:28px 0 12px}h2 small,.mu,small{color:var(--mu);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh)}
.card .nm{font-weight:650}.card em{position:absolute;top:8px;right:10px;color:var(--ok);font-style:normal;font-weight:800}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.top b,.top h2{margin:0;flex:1;border:0;padding:0}
.pill{background:var(--c,var(--ac));color:#fff;border-radius:99px;padding:4px 14px;font-weight:700}
.qbox{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:16px;padding:22px;font-size:20px;font-weight:600;margin:10px 0 16px;box-shadow:var(--sh);white-space:pre-wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;font-size:18px}
.opt i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.opt.good{background:#16a34a22;border-color:var(--ok);animation:pop .4s}.opt.bad{background:#e11d4822;border-color:var(--no);animation:shake .4s}.opt.dim{opacity:.5}
@keyframes pop{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin:16px 0 8px;padding:12px 16px;border-radius:12px;font-weight:600;animation:up .3s}.fb.ok{background:#16a34a22;color:var(--ok)}.fb.no{background:#e11d4822;color:var(--no)}.fb.hp{background:#5b5bf022;color:var(--ac)}
.steps{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 14px 14px 40px;margin:0 0 14px}.steps li{margin:6px 0;animation:up .4s both}.steps li:last-child{font-weight:700;color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;margin:20px auto;position:relative}.ring::before{content:"";position:absolute;inset:12px;background:var(--card);border-radius:50%}.ring b{position:relative;font-size:32px}
.scene{perspective:1100px;height:260px;margin:18px 0}.fcard{position:relative;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer}.fcard.flip{transform:rotateY(180deg)}
.scene:hover .fcard:not(.flip){transform:rotateY(-6deg) scale(1.02)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--card);border:2px solid var(--c);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.face h3{margin:0;font-size:26px}.face p{margin:0;font-size:19px}.back{transform:rotateY(180deg);background:var(--c);color:#fff}.chip{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.slide{animation:sl .35s}@keyframes sl{from{opacity:0;transform:translateX(40px)}}
select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px}textarea{width:100%;height:90px;margin-top:6px}
.dr{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(460px,calc(100vw - 20px));max-height:calc(100% - 80px);overflow:auto;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:10px 12px 12px;opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;transition:.25s}
.dr.on{opacity:1;transform:none;pointer-events:auto}.dh{display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:move;touch-action:none}.dh b{flex:1}.dh .ic{padding:2px 9px}
#cd{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:right;min-height:78px;margin-bottom:8px;word-break:break-all}#ce{font-size:20px}#cr{font-size:28px;font-weight:700;color:var(--ac)}
#ck{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}#ck button{padding:12px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:16px;transition:transform .12s,box-shadow .12s}#ck button:hover{transform:scale(1.08);box-shadow:0 0 0 2px var(--ac)}#ck .op{background:#5b5bf022}#ck .eq{background:var(--ac);color:#fff}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tb .btn{padding:5px 10px}.tb .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd);padding:0}
#pv{display:inline-block;background:var(--tx);border-radius:50%;flex:none}
.cw{position:relative;background:#fff;border-radius:12px;border:1px solid var(--bd);overflow:hidden}.cw canvas{width:100%;display:block;cursor:none;touch-action:none}
#ring{position:absolute;border:2px solid #888;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall 2.4s ease-in forwards;z-index:30;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.scene.dg{height:auto}.scene.dg .fcard{height:auto;display:grid}.scene.dg .face{position:relative;grid-area:1/1;align-items:stretch;justify-content:center;text-align:left;padding:18px 22px}
.scene.dg .chip{align-self:flex-start}.back.dgb{background:var(--card);color:var(--tx)}
.dgi{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:center}.dsv svg{width:100%;max-width:300px;display:block;margin:0 auto}
.face .dq{font-size:18px;line-height:1.6;margin:6px 0 0}.face .da{font-size:28px;font-weight:700;color:var(--ac);margin:6px 0}.face .dw{font-size:15px;color:var(--mu);margin:0 0 8px}

nav{flex-wrap:wrap}.tab.on small{color:#fffc}
.f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}.f i{font-style:normal;border-bottom:1px solid currentColor;padding:0 3px}.f b{font-weight:400;padding:0 3px}
.pc{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s}.pc:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--c),var(--sh)}
.ptq{display:flex;gap:12px;font-size:18px}.lb{flex:none;min-width:34px;height:34px;padding:0 10px;border-radius:99px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.pta{display:none;background:var(--bg);border:1px dashed var(--c);border-radius:12px;padding:12px 14px;margin-top:12px}.pta.open{display:block;animation:up .35s}
.fig{margin:8px 0;max-width:100%}.fig svg{max-width:100%;height:auto;display:block}.fig text{fill:var(--tx);font-size:13px}
.done{background:linear-gradient(135deg,#16a34a,#0d9488);color:#fff;border-radius:16px;padding:16px 20px;margin:12px 0;animation:up .4s;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.done .btn{color:var(--tx)}
.pta .steps{border:0;background:none;padding:0 0 0 24px;margin:8px 0}.pta .steps li{margin:7px 0}
.btn.sel{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.sel2{background:var(--no);color:#fff;border-color:var(--no)}
</style></head><body>
<nav><div class="brand">∑ Maths Revision</div>
<div class="tabs"><button class="tab hv on" id="t0" onclick="go('home')">Topics</button><button class="tab hv" id="t1" onclick="fcStart()">Flashcards</button><button class="tab hv" id="t2" onclick="go('pt')">Practice test</button></div>
<div class="tools"><button class="ic hv" onclick="tool('calc')" title="Calculator">🧮</button><button class="ic hv" onclick="tool('pad')" title="Notepad">✏️</button><button class="ic hv" onclick="th()" title="Light / dark">🌓</button></div></nav>
<main id="app"></main>
<aside class="dr" id="dr">
<div class="dh" id="dh"><b id="dt">🧮 Calculator</b><button class="ic hv" onclick="tool('calc',1)">🧮</button><button class="ic hv" onclick="tool('pad',1)">✏️</button><button class="ic hv" onclick="$('#dr').classList.remove('on')">✕</button></div>

<span id="sws"></span><input type="range" id="sl" min="1" max="80" value="3" oninput="ssz(+this.value)" style="width:90px"><span id="pv"></span>
<button class="btn hv" onclick="und()">↶ Undo</button><button class="btn hv" onclick="clr()">🗑 Clear</button></div>
<div class="cw"><canvas id="cv" width="900" height="560"></canvas><div id="ring"></div></div></div>
</aside>
<script>
(function(){
var D = Math.PI / 180;
  var R = function (x) { return Math.round(x * 10) / 10; };
  var P = function (c, rr, a) { return [c[0] + rr * Math.cos(a * D), c[1] - rr * Math.sin(a * D)]; };
  var ang = function (v, p) { return Math.atan2(-(p[1] - v[1]), p[0] - v[0]) / D; };
  var unit = function (v, p) { var dx = p[0] - v[0], dy = p[1] - v[1], l = Math.hypot(dx, dy); return [dx / l, dy / l]; };
  var T = 'var(--tx)', T2 = 'var(--mu)', ACC = 'var(--ac)';

  var sv = function (x) { return '<svg viewBox="0 0 280 210" role="img" aria-label="Diagram for the question">' + x + '</svg>'; };
  var ln = function (a, b, dash) { return '<line x1="' + R(a[0]) + '" y1="' + R(a[1]) + '" x2="' + R(b[0]) + '" y2="' + R(b[1]) + '" stroke="' + (dash ? T2 : T) + '" stroke-width="' + (dash ? 1 : 1.5) + '" ' + (dash ? 'stroke-dasharray="4 3"' : '') + '/>'; };
  var poly = function (pts) { return '<polygon points="' + pts.map(function (p) { return R(p[0]) + ',' + R(p[1]); }).join(' ') + '" fill="var(--bg)" stroke="' + T + '" stroke-width="1.5" stroke-linejoin="round"/>'; };
  var dots = function () { return Array.prototype.slice.call(arguments).map(function (p) { return '<circle cx="' + R(p[0]) + '" cy="' + R(p[1]) + '" r="2.5" fill="' + T + '"/>'; }).join(''); };
  var txt = function (x, y, s, o) {
    o = o || {};
    return '<text x="' + R(x) + '" y="' + R(y) + '" text-anchor="' + (o.a || 'middle') + '" dominant-baseline="central" font-size="' + (o.s || 13) + '" font-weight="' + (o.w || 400) + '" fill="' + (o.c || T) + '" style="paint-order:stroke;stroke:var(--card);stroke-width:3px">' + s + '</text>';
  };
  var lab = function (x, y, s) { return txt(x, y, s, { w: 500 }); };
  var val = function (t, s, q) { return txt(t[0], t[1], s, { w: 500, c: q ? ACC : T }); };
  var at = function (p, deg, len) { return [p[0] + len * Math.cos(deg * D), p[1] - len * Math.sin(deg * D)]; };
  function wedge(v, p1, p2, rad, s, tr, q, pos) {
    var a1 = ang(v, p1), a2 = ang(v, p2), d = (((a2 - a1) % 360) + 540) % 360 - 180;
    var st = [v[0] + rad * Math.cos(a1 * D), v[1] - rad * Math.sin(a1 * D)];
    var en = [v[0] + rad * Math.cos(a2 * D), v[1] - rad * Math.sin(a2 * D)];
    var m = a1 + d / 2, t = pos || [v[0] + tr * Math.cos(m * D), v[1] - tr * Math.sin(m * D)];
    return '<path d="M' + R(v[0]) + ',' + R(v[1]) + ' L' + R(st[0]) + ',' + R(st[1]) + ' A' + rad + ',' + rad + ' 0 0 ' + (d > 0 ? 0 : 1) + ' ' + R(en[0]) + ',' + R(en[1]) + ' Z" fill="#EF9F27" fill-opacity=".45" stroke="#BA7517" stroke-width=".8"/>' + (s === '' ? '' : val(t, s, q));
  }
  function arc(v, p1, p2, rad) {
    var a1 = ang(v, p1), a2 = ang(v, p2), d = (((a2 - a1) % 360) + 540) % 360 - 180;
    var st = [v[0] + rad * Math.cos(a1 * D), v[1] - rad * Math.sin(a1 * D)];
    var en = [v[0] + rad * Math.cos(a2 * D), v[1] - rad * Math.sin(a2 * D)];
    return '<path d="M' + R(st[0]) + ',' + R(st[1]) + ' A' + rad + ',' + rad + ' 0 0 ' + (d > 0 ? 0 : 1) + ' ' + R(en[0]) + ',' + R(en[1]) + '" fill="none" stroke="#BA7517" stroke-width="1.5"/>';
  }
  function ra(v, p1, p2, s) {
    s = s || 9;
    var u = unit(v, p1), w = unit(v, p2);
    var a = [v[0] + u[0] * s, v[1] + u[1] * s], b = [a[0] + w[0] * s, a[1] + w[1] * s], c = [v[0] + w[0] * s, v[1] + w[1] * s];
    return '<path d="M' + R(a[0]) + ',' + R(a[1]) + ' L' + R(b[0]) + ',' + R(b[1]) + ' L' + R(c[0]) + ',' + R(c[1]) + '" fill="none" stroke="' + T + '" stroke-width="1"/>';
  }
  var tick = function (a, b) {
    var m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], u = unit(a, b), n = [-u[1], u[0]];
    return ln([m[0] - n[0] * 5, m[1] - n[1] * 5], [m[0] + n[0] * 5, m[1] + n[1] * 5]);
  };
  var par = function (p, deg) {
    var u = [Math.cos(deg * D), -Math.sin(deg * D)], n = [-u[1], u[0]];
    var a = [p[0] - 7 * u[0] + 5 * n[0], p[1] - 7 * u[1] + 5 * n[1]], b = [p[0] - 7 * u[0] - 5 * n[0], p[1] - 7 * u[1] - 5 * n[1]];
    return '<path d="M' + R(a[0]) + ',' + R(a[1]) + ' L' + R(p[0]) + ',' + R(p[1]) + ' L' + R(b[0]) + ',' + R(b[1]) + '" fill="none" stroke="' + T + '" stroke-width="1.5"/>';
  };
  var tri = function (A, B, aA, aB) {
    var aC = 180 - aA - aB, L = Math.hypot(B[0] - A[0], B[1] - A[1]), t = L * Math.sin(aB * D) / Math.sin(aC * D);
    return [A[0] + t * Math.cos(aA * D), A[1] - t * Math.sin(aA * D)];
  };
  var north = function (v, name) { return ln(v, [v[0], v[1] - 55], true) + lab(v[0], v[1] - 66, 'N'); };
  var barc = function (v, b, rad) {
    var s = [v[0], v[1] - rad], e = [v[0] + rad * Math.sin(b * D), v[1] - rad * Math.cos(b * D)];
    return '<path d="M' + R(s[0]) + ',' + R(s[1]) + ' A' + rad + ',' + rad + ' 0 ' + (b > 180 ? 1 : 0) + ' 1 ' + R(e[0]) + ',' + R(e[1]) + '" fill="none" stroke="#BA7517" stroke-width="2"/>';
  };
  /* parallel lines helper: two horizontal lines cut by a transversal at dir degrees */
  var parallels = function (dir, x2) {
    var P2 = [x2, 140], t = 65 / Math.sin(dir * D), P1 = [P2[0] + t * Math.cos(dir * D), 75];
    return { P1: P1, P2: P2, ta: at(P2, dir + 180, 38), tb: at(P1, dir, 38),
      draw: ln([30, 75], [250, 75]) + ln([30, 140], [250, 140]) + par([240, 75], 0) + par([240, 140], 0) };
  };

  
var C=[110,100],r=70;
var circ=function(c,rr){c=c||C;rr=rr||r;return '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+rr+'" fill="var(--bg)" stroke="'+T2+'" stroke-width="1.2"/>'};
var nm=function(s,p,from,off){off=off||14;var u=unit(from,p);return txt(p[0]+u[0]*off,p[1]+u[1]*off,s,{w:500})};
var CT=[
    { t: 'Alternate segment theorem', a: '52°',
      q: 'The angle between the tangent and chord AC is 52°. Find angle ABC.',
      w: 'The angle between a tangent and a chord equals the angle in the alternate segment. So angle ABC = 52°.',
      s: function (f) {
        var A = P(C, r, 235), Cc = P(C, r, 339), B = P(C, r, 110);
        var t1 = [A[0] + 55 * Math.cos(145 * D), A[1] - 55 * Math.sin(145 * D)];
        var t2 = [A[0] + 55 * Math.cos(325 * D), A[1] - 55 * Math.sin(325 * D)];
        return sv(circ() + ln(t1, t2) + ln(A, Cc) + ln(A, B) + ln(B, Cc) + wedge(A, t2, Cc, 24, '52°', 42) + wedge(B, A, Cc, 22, f ? '52°' : '?', 38, !f) + dots(A, B, Cc) + nm('A', A, C) + nm('B', B, C) + nm('C', Cc, C));
      } },
    { t: 'Angle at the centre theorem', a: '70°',
      q: 'The angle at the circumference is 35°. Find the angle at the centre on the same arc.',
      w: 'The angle at the centre is twice the angle at the circumference: 2 × 35° = 70°.',
      s: function (f) {
        var A = P(C, r, 55), B = P(C, r, 125), Dd = P(C, r, 270);
        return sv(circ() + ln(C, A) + ln(C, B) + ln(Dd, A) + ln(Dd, B) + wedge(C, A, B, 20, f ? '70°' : '?', 36, !f) + wedge(Dd, A, B, 26, '35°', 50) + dots(A, B, Dd, C) + nm('A', A, C) + nm('B', B, C) + nm('D', Dd, C) + txt(C[0] + 13, C[1] + 10, 'O', { w: 500 }));
      } },
    { t: 'Angles in the same segment', a: '48°',
      q: 'Angle ACB = 48°, and C and D are on the same side of chord AB. Find angle ADB.',
      w: 'Angles in the same segment, standing on the same chord, are equal. So angle ADB = 48°.',
      s: function (f) {
        var A = P(C, r, 222), B = P(C, r, 318), Cc = P(C, r, 120), Dd = P(C, r, 50);
        return sv(circ() + ln(A, B, true) + ln(Cc, A) + ln(Cc, B) + ln(Dd, A) + ln(Dd, B) + wedge(Cc, A, B, 24, '48°', 44) + wedge(Dd, A, B, 24, f ? '48°' : '?', 46, !f) + dots(A, B, Cc, Dd) + nm('A', A, C) + nm('B', B, C) + nm('C', Cc, C) + nm('D', Dd, C));
      } },
    { t: 'Angle in a semicircle', a: '52°',
      q: 'AB is a diameter and angle CAB = 38°. Find angle ABC.',
      w: 'Angle ACB = 90° (angle in a semicircle). Angles in a triangle add to 180°, so ABC = 180° − 90° − 38° = 52°.',

function gsvg(o){
  const W=o.W||600,H=o.H||340,L=46,B=36,T=12,R=16,pw=W-L-R,ph=H-T-B;
  const X=x=>L+x/o.xm*pw,Y=y=>T+ph-y/o.ym*ph;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt}">`;
  const gl=(max,step,div,hz)=>{for(let v=0;v<=max+1e-9;v+=step/div){const major=Math.abs(v/step-Math.round(v/step))<1e-6;
    s+=hz?`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#999" stroke-opacity="${major?.7:.25}" stroke-width="${major?1:.5}"/>`
         :`<line y1="${T}" y2="${T+ph}" x1="${X(v)}" x2="${X(v)}" stroke="#999" stroke-opacity="${major?.7:.25}" stroke-width="${major?1:.5}"/>`;
    if(major)s+=hz?`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`:`<text x="${X(v)}" y="${T+ph+16}" text-anchor="middle">${Math.round(v)}</text>`;}};
  gl(o.xm,o.xs,5,false);gl(o.ym,o.ys,5,true);
  s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" stroke="currentColor" stroke-width="1.5"/><line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="currentColor" stroke-width="1.5"/>`;
  s+=`<text x="${L+pw/2}" y="${H-4}" text-anchor="middle" font-style="italic">${o.xl}</text><text transform="translate(12 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-style="italic">${o.yl}</text>`;
  o.lines.forEach(l=>{s+=`<line x1="${X(l.a[0])}" y1="${Y(l.a[1])}" x2="${X(l.b[0])}" y2="${Y(l.b[1])}" stroke="${l.c||'currentColor'}" stroke-width="3" ${l.d?'stroke-dasharray="8 5"':''}/>`;
    if(l.t)s+=`<text x="${X(l.tx)}" y="${Y(l.ty)}" style="font-weight:700;fill:${l.c||'currentColor'}">${l.t}</text>`});
  return s+'</svg>';
}

const PT=[{"t": "Q1", "n": "Question One", "i": "", "f": "", "p": [{"id": "1a", "l": "(a)", "q": "Solve for <i>x</i> in (3<i>x</i> − 1)² − 9(<i>x</i> + 1)² = 16", "a": "Expand the first bracket: (3<i>x</i> − 1)² = 9<i>x</i>² − 6<i>x</i> + 1<br>Expand the second bracket: 9(<i>x</i> + 1)² = 9(<i>x</i>² + 2<i>x</i> + 1) = 9<i>x</i>² + 18<i>x</i> + 9<br>Subtract the second from the first, watching the signs: 9<i>x</i>² − 6<i>x</i> + 1 − 9<i>x</i>² − 18<i>x</i> − 9 = 16<br>The <i>x</i>² terms cancel, leaving: −24<i>x</i> − 8 = 16<br>Add 8 to both sides: −24<i>x</i> = 24<br>Divide both sides by −24<br>Answer: <i>x</i> = −1"}, {"id": "1b", "l": "(b)", "q": "Hana hired a kayak. It cost $30 for the first three hours, and then $8 for every additional hour. Her hire cost $78 in total. How long did she hire the kayak?", "a": "Let <i>n</i> = the number of extra hours (after the first 3 hours).<br>Write an equation: 30 + 8<i>n</i> = 78<br>Subtract 30 from both sides: 8<i>n</i> = 48<br>Divide both sides by 8: <i>n</i> = 6<br>Total time = 3 + 6<br>Answer: 9 hours"}, {"id": "1c", "l": "(c)", "q": "Solve the equation <span class=\"f\"><i>x² − 5x + 4</i><b>x² − x − 12</b></span> = <span class=\"f\"><i>6</i><b>x</b></span>", "a": "Factorise the top: <i>x</i>² − 5<i>x</i> + 4 = (<i>x</i> − 1)(<i>x</i> − 4)<br>Factorise the bottom: <i>x</i>² − <i>x</i> − 12 = (<i>x</i> + 3)(<i>x</i> − 4)<br>Cancel the common bracket (<i>x</i> − 4) (so <i>x</i> ≠ 4, −3, 0): (<i>x</i> − 1)/(<i>x</i> + 3) = 6/x<br>Cross-multiply: <i>x</i>(<i>x</i> − 1) = 6(<i>x</i> + 3)<br>Expand: <i>x</i>² − <i>x</i> = 6<i>x</i> + 18<br>Make one side zero: <i>x</i>² − 7<i>x</i> − 18 = 0<br>Factorise: (<i>x</i> − 9)(<i>x</i> + 2) = 0<br>Answer: <i>x</i> = 9 or <i>x</i> = −2 (neither is an excluded value)"}, {"id": "1d", "l": "(d)", "q": "A library has noticed more people borrowing e-books. In October, it lent 9 more e-books than it did in September. In November, it lent 3 times as many e-books as it did in September. It lent 144 e-books over the three months. How many e-books were lent in October?", "a": "Let September = <i>x</i>. Then October = <i>x</i> + 9 and November = 3<i>x</i>.<br>Total: <i>x</i> + (<i>x</i> + 9) + 3<i>x</i> = 144<br>Collect like terms: 5<i>x</i> + 9 = 144<br>Subtract 9: 5<i>x</i> = 135<br>Divide by 5: <i>x</i> = 27 (September)<br>October = 27 + 9<br>Answer: 36"}, {"id": "1e", "l": "(e)", "q": "Aroha thinks of a number <i>N</i>. When her number is squared, she gets <i>k</i> less than 9. When her number is cubed, the result is <i>m</i> times <i>N</i>. Give an expression for <i>k</i> in terms of <i>m</i> only.", "a": "\"<i>k</i> less than 9\" means <i>N</i>² = 9 − <i>k</i><br>Cubed: <i>N</i>³ = mN. Divide both sides by <i>N</i> (<i>N</i> ≠ 0): <i>N</i>² = <i>m</i><br>Both expressions equal <i>N</i>², so 9 − <i>k</i> = <i>m</i><br>Rearrange to make <i>k</i> the subject<br>Answer: <i>k</i> = 9 − <i>m</i>"}]}, {"t": "Q2", "n": "Question Two", "i": "", "f": "", "p": [{"id": "2a", "l": "(a)", "q": "Write an expression for the perimeter of this triangle. Simplify fully.", "a": "Perimeter = add all three sides: (2<i>x</i> + 5) + (3<i>x</i>² + <i>x</i> − 2) + (<i>x</i>² − 4<i>x</i> + 1)<br><i>x</i>² terms: 3<i>x</i>² + <i>x</i>² = 4<i>x</i>²<br><i>x</i> terms: 2<i>x</i> + <i>x</i> − 4<i>x</i> = −<i>x</i><br>Numbers: 5 − 2 + 1 = 4<br>Put it together:<br>Answer: 4<i>x</i>² − <i>x</i> + 4", "f": "<svg class=\"fig\" viewBox=\"0 0 330 190\" width=\"330\" role=\"img\" aria-label=\"Triangle with sides 2x+5, 3x squared plus x minus 2, and x squared minus 4x plus 1\">\n<polygon points=\"165,12 20,160 310,160\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n<text x=\"38\" y=\"75\" text-anchor=\"middle\">2x + 5</text><text x=\"290\" y=\"75\" text-anchor=\"middle\">3x² + x − 2</text><text x=\"165\" y=\"182\" text-anchor=\"middle\">x² − 4x + 1</text></svg>"}, {"id": "2b", "l": "(b)", "q": "A rectangle has an area of <i>x</i>² + 6<i>x</i> − 7. If the area of the rectangle is 65 cm², what is the value(s) of <i>x</i>?", "a": "Set the area equal to 65: <i>x</i>² + 6<i>x</i> − 7 = 65<br>Subtract 65 from both sides: <i>x</i>² + 6<i>x</i> − 72 = 0<br>Find two numbers that multiply to −72 and add to 6: 12 and −6<br>Factorise: (<i>x</i> + 12)(<i>x</i> − 6) = 0<br>Set each bracket to zero<br>Answer: <i>x</i> = 6 or <i>x</i> = −12", "f": "<svg class=\"fig\" viewBox=\"0 0 230 120\" width=\"230\" role=\"img\" aria-label=\"Rectangle with area x squared plus 6x minus 7\"><rect x=\"10\" y=\"10\" width=\"210\" height=\"100\" fill=\"var(--bg)\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"115\" y=\"66\" text-anchor=\"middle\">Area = x² + 6x − 7</text></svg>"}, {"id": "2c", "l": "(c)", "q": "Solve &nbsp; 9 × 3<sup>2<i>x</i> − 1</sup> = 3<sup>7</sup>", "a": "Write 9 as a power of 3: 9 = 3²<br>Add the powers when multiplying: 3² × 3^(2<i>x</i> − 1) = 3^(2<i>x</i> + 1)<br>Both sides now have base 3, so equate the powers: 2<i>x</i> + 1 = 7<br>Subtract 1 from both sides: 2<i>x</i> = 6<br>Divide both sides by 2<br>Answer: <i>x</i> = 3"}, {"id": "2d", "l": "(d)", "q": "At Kiri’s Bakery, three pies and four juices cost $27. Five pies and two juices cost $31. How much will I pay for two pies and two juices?", "a": "Let pie = <i>p</i> and juice = <i>j</i>: 3<i>p</i> + 4<i>j</i> = 27 (1) and 5<i>p</i> + 2<i>j</i> = 31 (2)<br>Make the <i>j</i> terms match: (2)×2 gives 10<i>p</i> + 4<i>j</i> = 62 (3)<br>Subtract (1) from (3) to eliminate <i>j</i>: 7<i>p</i> = 35<br>Divide by 7: <i>p</i> = 5<br>Substitute into (1): 15 + 4<i>j</i> = 27 → 4<i>j</i> = 12 → <i>j</i> = 3<br>Two pies and two juices: 2 × 5 + 2 × 3 = 10 + 6<br>Answer: $16"}, {"id": "2e", "l": "(e)", "q": "Show that if you add the squares of two consecutive odd numbers and then subtract 2, the result is a multiple of 8.", "a": "Let the two consecutive odd numbers be 2<i>n</i> − 1 and 2<i>n</i> + 1 (odd numbers differ by 2).<br>Square each: (2<i>n</i> − 1)² = 4<i>n</i>² − 4<i>n</i> + 1 and (2<i>n</i> + 1)² = 4<i>n</i>² + 4<i>n</i> + 1<br>Add them and subtract 2: 4<i>n</i>² − 4<i>n</i> + 1 + 4<i>n</i>² + 4<i>n</i> + 1 − 2<br>Collect like terms (the <i>n</i> terms cancel): 8<i>n</i>²<br>Answer: 8<i>n</i>² = 8 × <i>n</i>², so it is a multiple of 8."}]}, {"t": "Q3", "n": "Question Three", "i": "", "f": "", "p": [{"id": "3a", "l": "(a)", "q": "Solve 3<i>x</i>² − 10<i>x</i> − 8 = 0", "a": "Multiply a × c: 3 × (−8) = −24<br>Find two numbers that multiply to −24 and add to −10: −12 and 2<br>Split the middle term: 3<i>x</i>² − 12<i>x</i> + 2<i>x</i> − 8 = 0<br>Factorise in pairs: 3<i>x</i>(<i>x</i> − 4) + 2(<i>x</i> − 4) = 0<br>Take out the common bracket: (3<i>x</i> + 2)(<i>x</i> − 4) = 0<br>Set each bracket to zero: 3<i>x</i> + 2 = 0 → <i>x</i> = −2/3; <i>x</i> − 4 = 0 → <i>x</i> = 4<br>Answer: <i>x</i> = −2/3 or <i>x</i> = 4"}, {"id": "3b", "l": "(b)", "q": "Solve &nbsp; <span class=\"f\"><i>x − 1</i><b>3</b></span> − <span class=\"f\"><i>x</i><b>2</b></span> ≤ 2", "a": "Multiply every term by 6 (the lowest common multiple of 3 and 2) to clear the fractions: 2(<i>x</i> − 1) − 3<i>x</i> ≤ 12<br>Expand the bracket: 2<i>x</i> − 2 − 3<i>x</i> ≤ 12<br>Collect like terms: −<i>x</i> − 2 ≤ 12<br>Add 2 to both sides: −<i>x</i> ≤ 14<br>Divide both sides by −1 — dividing by a negative flips the inequality sign<br>Answer: <i>x</i> ≥ −14"}, {"id": "3c", "l": "(c)", "q": "Find the value(s) of <i>x</i>: &nbsp; 3<sup><i>x</i>²</sup> ≤ 3<sup>2<i>x</i></sup> × 27", "a": "Write 27 as a power of 3: 27 = 3³<br>Add the powers on the right: 3^(2<i>x</i>) × 3³ = 3^(2<i>x</i> + 3)<br>Compare the powers (base 3 is greater than 1, so the inequality stays the same way): <i>x</i>² ≤ 2<i>x</i> + 3<br>Make one side zero: <i>x</i>² − 2<i>x</i> − 3 ≤ 0<br>Factorise: (<i>x</i> − 3)(<i>x</i> + 1) ≤ 0<br>The graph is a \"smile\" shape, which is below zero between its roots <i>x</i> = −1 and <i>x</i> = 3<br>Answer: −1 ≤ <i>x</i> ≤ 3"}, {"id": "3d", "l": "(d)", "q": "Simplify as far as possible &nbsp; <span class=\"f\"><i>x² − x − 12</i><b>−2x² − 6x</b></span>", "a": "Factorise the top: <i>x</i>² − <i>x</i> − 12 = (<i>x</i> − 4)(<i>x</i> + 3)<br>Factorise the bottom (take out −2<i>x</i>): −2<i>x</i>² − 6<i>x</i> = −2<i>x</i>(<i>x</i> + 3)<br>Cancel the common bracket (<i>x</i> + 3): (<i>x</i> − 4)/(−2<i>x</i>)<br>Move the negative to the top: (4 − <i>x</i>)/(2<i>x</i>)<br>Answer: (4 − <i>x</i>)/(2<i>x</i>) (or −(<i>x</i> − 4)/(2<i>x</i>))"}, {"id": "3e", "l": "(e)", "q": "Hamish posts a video online. The formula for the total number of views is <i>V</i> = 4 × 3<sup>(<i>h</i> − 1)</sup>, where <i>V</i> is the number of views and <i>h</i> is the number of hours since posting. The video has 324 views. How many hours since it was posted?", "a": "Substitute <i>V</i> = 324: 324 = 4 × 3^(<i>h</i> − 1)<br>Divide both sides by 4: 81 = 3^(<i>h</i> − 1)<br>Write 81 as a power of 3: 81 = 3⁴<br>Equate the powers: <i>h</i> − 1 = 4<br>Add 1 to both sides<br>Answer: <i>h</i> = 5 hours"}, {"id": "3f", "l": "(f)", "q": "The sum of the interior angles of a polygon with <i>n</i> sides is given by <i>S</i> = 180(<i>n</i> − 2). Rearrange the formula to make <i>n</i> the subject, then find the number of sides if the angles add to 1260°.", "a": "Divide both sides by 180: <i>S</i> ÷ 180 = <i>n</i> − 2<br>Add 2 to both sides: <i>n</i> = <i>S</i> ÷ 180 + 2<br>Substitute <i>S</i> = 1260: <i>n</i> = 1260 ÷ 180 + 2<br>Calculate: <i>n</i> = 7 + 2<br>Answer: 9 sides"}]}, {"t": "Q4", "n": "Question Four", "i": "Zara hires a “Zing” electric scooter to travel around the city. The cost to hire is made up of an initial unlock fee, plus a set charge per minute she rides.", "f": "g4", "p": [{"id": "4a", "l": "(a)", "q": "How much does it cost to unlock the scooter?", "a": "The unlock fee is the cost before any time has passed, so look at <i>t</i> = 0 on the graph<br>Find where the line meets the vertical (cost) axis<br>Read off the cost at that point<br>Answer: $6"}, {"id": "4b", "l": "(b)", "q": "How is this shown on the graph?", "a": "The unlock fee is charged before any minutes are ridden, so it is the cost at <i>t</i> = 0<br>That is the point where the line crosses the vertical (cost) axis<br>Answer: The <i>y</i>-intercept"}, {"id": "4c", "l": "(c)", "q": "How much does the scooter cost per minute to hire?", "a": "Pick two points on the line, e.g. (0, 6) and (50, 26)<br>Cost per minute = change in cost ÷ change in time<br>(26 − 6) ÷ (50 − 0) = 20 ÷ 50<br>Answer: $0.40 per minute"}, {"id": "4d", "l": "(d)", "q": "How is the per-minute cost shown on the graph?", "a": "The cost per minute is how much the cost goes up for every extra minute<br>On a graph, that is how steep the line is, its gradient<br>Check: the line rises $4 for every 10 minutes, and 4 ÷ 10 = 0.4<br>Answer: The gradient"}, {"id": "4e", "l": "(e)", "q": "Write an equation showing the relationship between the <i>total cost (C)</i> and the <i>time ridden in minutes (t)</i>.", "a": "A straight line has the form <i>C</i> = (rate) × <i>t</i> + (starting cost)<br>The rate is 0.4 per minute and the starting cost (unlock fee) is 6<br>Answer: <i>C</i> = 0.4<i>t</i> + 6"}, {"id": "4f", "l": "(f)", "q": "Zara thinks she will ride for <i>35 minutes</i>. How much will this cost?", "a": "Substitute <i>t</i> = 35 into <i>C</i> = 0.4<i>t</i> + 6<br><i>C</i> = 0.4 × 35 + 6<br><i>C</i> = 14 + 6<br>Answer: $20"}, {"id": "4g", "l": "(g)", "q": "Manu hires a Zing scooter and is charged <i>$18</i>. How long did he have the scooter?", "a": "Substitute <i>C</i> = 18: 18 = 0.4<i>t</i> + 6<br>Subtract 6 from both sides: 12 = 0.4<i>t</i><br>Divide both sides by 0.4: <i>t</i> = 30<br>Answer: 30 minutes"}, {"id": "4h", "l": "(h)", "q": "A rival company, “Glide”, charges <i>$10</i> to unlock a scooter but charges the same per-minute rate as Zing. How will the graphs for Glide and Zing differ?", "a": "Glide’s unlock fee is $10 and Zing’s is $6, so Glide’s line starts higher on the cost axis (<i>y</i>-intercept 10 instead of 6)<br>The per-minute rate is the same, so the lines have the same gradient and are parallel<br>Answer: Glide’s line starts higher but is parallel to Zing’s."}, {"id": "4i", "l": "(i)", "q": "What would be exactly the same for both graphs?", "a": "Both companies charge the same amount per minute<br>The per-minute charge is shown by the steepness of the line<br>Answer: The gradient (steepness)"}, {"id": "4j", "l": "(j)", "q": "Write an equation to show how Glide charges for hire.", "a": "Use the same form as Zing: <i>C</i> = (rate) × <i>t</i> + (unlock fee)<br>The rate is the same (0.4) and Glide’s unlock fee is 10<br>Answer: <i>C</i> = 0.4<i>t</i> + 10"}, {"id": "4k", "l": "(k)", "q": "Another company, “Rocket”, charges <i>$12 for 10 minutes</i> and <i>$21 for 40 minutes</i>. Draw the graph on the same axes above showing this relationship, and write down its equation. <small>(Sketch it on the ✏️ notepad, then compare with the graph in the answer.)</small>", "a": "Plot the points (10, 12) and (40, 21) and join them with a straight line (extend it to the cost axis)<br>Gradient = change in cost ÷ change in time = (21 − 12) ÷ (40 − 10) = 9 ÷ 30 = 0.3<br>Use <i>C</i> = 0.3<i>t</i> + c with the point (10, 12): 12 = 0.3 × 10 + c<br>12 = 3 + c → c = 9<br>Answer: <i>C</i> = 0.3<i>t</i> + 9 (the dotted line on the graph)", "af": "g4k"}]}, {"t": "Q5", "n": "Question Five", "i": "(a) The graph shows the hire charges for two companies hiring out carpet cleaners. Sparkle charges a delivery fee plus an hourly rate. Brightway does not charge a delivery fee.", "f": "g5", "p": [{"id": "5ai", "l": "(a)(i)", "q": "What is the delivery fee charged by Sparkle?", "a": "The delivery fee is charged before any hours are used, so look at 0 hours<br>Find where Sparkle’s line meets the vertical (dollars) axis<br>Answer: $20"}, {"id": "5aii", "l": "(a)(ii)", "q": "What is the difference in the hourly rate charged by each company?", "a": "The hourly rate is the gradient: how much the line rises each
